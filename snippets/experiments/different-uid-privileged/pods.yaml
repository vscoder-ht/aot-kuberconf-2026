# Секрет этой проверки. password — base64 от privileged_reader_password, без перевода строки.
apiVersion: v1
kind: Secret
metadata:
  name: different-uid-privileged
  labels:
    case: hostpid-different-uid-privileged
type: Opaque
data:
  password: cHJpdmlsZWdlZF9yZWFkZXJfcGFzc3dvcmQ=
---
# Под с секретом от uid 1000. tail читает /tmp/different-uid-privileged,
# чтобы отличить процесс от других tail на узле.
# terminationGracePeriodSeconds: 1 — sh и sleep не ловят SIGTERM.
apiVersion: v1
kind: Pod
metadata:
  name: secret-privileged-uid
  labels:
    case: hostpid-different-uid-privileged
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: secret-container
      image: busybox
      command: ["sh", "-c", "touch /tmp/different-uid-privileged; exec tail -f /tmp/different-uid-privileged"]
      envFrom:
        - secretRef:
            name: different-uid-privileged
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
---
# Читающий под от uid 2000 с hostPID: true и privileged: true.
apiVersion: v1
kind: Pod
metadata:
  name: hostpid-privileged
  labels:
    case: hostpid-different-uid-privileged
spec:
  terminationGracePeriodSeconds: 1
  hostPID: true
  containers:
    - name: hostpid-container
      image: busybox
      command: ["sleep", "infinity"]
      securityContext:
        privileged: true
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
