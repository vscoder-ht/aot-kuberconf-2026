# Просмотр сведений узла. privileged не задан, том узла не задан, hostUsers не задан.
# node-info — uid 0. node-info-1000 — uid 1000.
# terminationGracePeriodSeconds: 1 — sleep не ловит SIGTERM.
apiVersion: v1
kind: Pod
metadata:
  name: node-info
  labels:
    case: node-info
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: sleep
      image: busybox:1.36
      command: ["sleep", "infinity"]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
---
apiVersion: v1
kind: Pod
metadata:
  name: node-info-1000
  labels:
    case: node-info
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: sleep
      image: busybox:1.36
      command: ["sleep", "infinity"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
