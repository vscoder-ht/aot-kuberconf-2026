# Helm-релиз mk8s-v-19-3-buildkit-rootless.
# Источник: vsc-kuberconf-aot-2026-stand/service/runners/templates/v_19_3_buildkit_rootless.yaml
# Ниже значения после подстановки для mk8s. На k3s оба профиля остаются Unconfined.
# Чарт gitlab-runner 0.94.3. gitlabUrl и runnerToken подставляет Terraform.

image:
  tag: alpine-v19.5.3
runners:
  executor: kubernetes
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "gitlab-runner"
        image = "alpine:3.20"
        privileged = false
        memory_request = "256Mi"
        memory_limit = "1Gi"
        builds_dir = "/tmp/builds"
        logs_base_dir = "/tmp"
        scripts_base_dir = "/tmp"

        [runners.kubernetes.pod_security_context]
          fs_group = 1000

        [runners.kubernetes.build_container_security_context]
          run_as_non_root = true
          run_as_user = 1000
          run_as_group = 1000
          allow_privilege_escalation = true

          [runners.kubernetes.build_container_security_context.capabilities]
            drop = ["ALL"]
            add = ["CHOWN", "DAC_OVERRIDE", "FOWNER", "FSETID", "SETGID", "SETUID", "SETFCAP"]

          [runners.kubernetes.build_container_security_context.seccomp_profile]
            type = "Localhost"
            localhost_profile = "stand-buildkit.json"

          [runners.kubernetes.build_container_security_context.app_armor_profile]
            type = "Localhost"
            localhost_profile = "stand-buildkit"

        [[runners.kubernetes.volumes.empty_dir]]
          name = "buildkit-state"
          mount_path = "/home/user/.local/share/buildkit"

        [[runners.kubernetes.volumes.empty_dir]]
          name = "buildkit-tmp"
          mount_path = "/tmp"
