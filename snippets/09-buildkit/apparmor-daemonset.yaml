# Доставка профиля AppArmor сборщика в ядро узла.
# Копирования файла недостаточно: профиль загружает apparmor_parser.
# Для вызова нужен hostPID: процесс входит в пространство PID узла.
# Удаление DaemonSet профиль из ядра не снимает.
# Основа — шаблон cri-containerd.apparmor.d. Вместо deny mount стоят mount и pivot_root.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkit-apparmor-profile
  labels:
    case: buildkit-seccomp
data:
  buildkit: |
    #include <tunables/global>

    profile buildkit flags=(attach_disconnected,mediate_deleted) {
      #include <abstractions/base>

      network,
      capability,
      file,
      umount,
      mount,
      pivot_root,

      signal (receive) peer=unconfined,
      signal (receive) peer=runc,
      signal (receive) peer=crun,
      signal (receive) peer=cri-containerd.apparmor.d,
      signal (send,receive) peer=buildkit,

      deny @{PROC}/* w,
      deny @{PROC}/{[^1-9],[^1-9][^0-9],[^1-9s][^0-9y][^0-9s],[^1-9][^0-9][^0-9][^0-9]*}/** w,
      deny @{PROC}/sys/[^k]** w,
      deny @{PROC}/sys/kernel/{?,??,[^s][^h][^m]**} w,
      deny @{PROC}/sysrq-trigger rwklx,
      deny @{PROC}/mem rwklx,
      deny @{PROC}/kmem rwklx,
      deny @{PROC}/kcore rwklx,

      deny /sys/[^f]*/** wklx,
      deny /sys/f[^s]*/** wklx,
      deny /sys/fs/[^c]*/** wklx,
      deny /sys/fs/c[^g]*/** wklx,
      deny /sys/fs/cg[^r]*/** wklx,
      deny /sys/firmware/** rwklx,
      deny /sys/devices/virtual/powercap/** rwklx,
      deny /sys/kernel/security/** rwklx,

      ptrace (trace,tracedby,read,readby) peer=buildkit,
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: buildkit-apparmor-installer
  labels:
    case: buildkit-seccomp
spec:
  selector:
    matchLabels:
      app: buildkit-apparmor-installer
  template:
    metadata:
      labels:
        app: buildkit-apparmor-installer
        case: buildkit-seccomp
    spec:
      hostPID: true
      containers:
        - name: installer
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp /profile/buildkit /host/etc/apparmor.d/buildkit
              enabled="$(nsenter -t 1 -m -- cat /sys/module/apparmor/parameters/enabled)"
              if [ "$enabled" != "Y" ]; then
                echo "apparmor module is not enabled" >&2
                exit 1
              fi
              parser=""
              for candidate in /usr/sbin/apparmor_parser /sbin/apparmor_parser; do
                if nsenter -t 1 -m -- test -x "$candidate"; then
                  parser="$candidate"
                  break
                fi
              done
              if [ -z "$parser" ]; then
                echo "apparmor_parser not found on the node" >&2
                exit 1
              fi
              nsenter -t 1 -m -- "$parser" -r -W /etc/apparmor.d/buildkit
              touch /ready
              sleep infinity
          readinessProbe:
            exec:
              command: ["cat", "/ready"]
            periodSeconds: 2
          securityContext:
            privileged: true
          volumeMounts:
            - name: profile
              mountPath: /profile
              readOnly: true
            - name: host-apparmor
              mountPath: /host/etc/apparmor.d
      volumes:
        - name: profile
          configMap:
            name: buildkit-apparmor-profile
        - name: host-apparmor
          hostPath:
            path: /etc/apparmor.d
            type: Directory
