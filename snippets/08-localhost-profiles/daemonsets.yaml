apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: seccomp-profile-installer
  labels:
    case: localhost-profiles
spec:
  selector:
    matchLabels:
      app: seccomp-profile-installer
  template:
    metadata:
      labels:
        app: seccomp-profile-installer
        case: localhost-profiles
    spec:
      containers:
        - name: installer
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp /profile/kuberconf-pivot-root.json /host/var/lib/kubelet/seccomp/kuberconf-pivot-root.json
              touch /ready
              sleep infinity
          readinessProbe:
            exec:
              command: ["cat", "/ready"]
            periodSeconds: 2
          securityContext:
            privileged: true
          volumeMounts:
            - name: profile
              mountPath: /profile
              readOnly: true
            - name: host-seccomp
              mountPath: /host/var/lib/kubelet/seccomp
      volumes:
        - name: profile
          configMap:
            name: seccomp-localhost-profile
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apparmor-localhost-profile
  labels:
    case: localhost-profiles
data:
  kuberconf-localhost: |
    #include <tunables/global>

    profile kuberconf-localhost flags=(attach_disconnected,mediate_deleted) {
      #include <abstractions/base>

      network,
      capability,
      file,
      umount,
      mount,
      pivot_root,

      signal (receive) peer=unconfined,
      signal (receive) peer=runc,
      signal (receive) peer=crun,
      signal (receive) peer=cri-containerd.apparmor.d,
      signal (send,receive) peer=kuberconf-localhost,

      deny @{PROC}/* w,
      deny @{PROC}/{[^1-9],[^1-9][^0-9],[^1-9s][^0-9y][^0-9s],[^1-9][^0-9][^0-9][^0-9]*}/** w,
      deny @{PROC}/sys/[^k]** w,
      deny @{PROC}/sys/kernel/{?,??,[^s][^h][^m]**} w,
      deny @{PROC}/sysrq-trigger rwklx,
      deny @{PROC}/mem rwklx,
      deny @{PROC}/kmem rwklx,
      deny @{PROC}/kcore rwklx,

      deny /sys/[^f]*/** wklx,
      deny /sys/f[^s]*/** wklx,
      deny /sys/fs/[^c]*/** wklx,
      deny /sys/fs/c[^g]*/** wklx,
      deny /sys/fs/cg[^r]*/** wklx,
      deny /sys/firmware/** rwklx,
      deny /sys/devices/virtual/powercap/** rwklx,
      deny /sys/kernel/security/** rwklx,

      ptrace (trace,tracedby,read,readby) peer=kuberconf-localhost,
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: apparmor-profile-installer
  labels:
    case: localhost-profiles
spec:
  selector:
    matchLabels:
      app: apparmor-profile-installer
  template:
    metadata:
      labels:
        app: apparmor-profile-installer
        case: localhost-profiles
    spec:
      hostPID: true
      containers:
        - name: installer
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp /profile/kuberconf-localhost /host/etc/apparmor.d/kuberconf-localhost
              enabled="$(nsenter -t 1 -m -- cat /sys/module/apparmor/parameters/enabled)"
              if [ "$enabled" != "Y" ]; then
                echo "apparmor module is not enabled" >&2
                exit 1
              fi
              parser=""
              for candidate in /usr/sbin/apparmor_parser /sbin/apparmor_parser; do
                if nsenter -t 1 -m -- test -x "$candidate"; then
                  parser="$candidate"
                  break
                fi
              done
              if [ -z "$parser" ]; then
                echo "apparmor_parser not found on the node" >&2
                exit 1
              fi
              nsenter -t 1 -m -- "$parser" -r -W /etc/apparmor.d/kuberconf-localhost
              touch /ready
              sleep infinity
          readinessProbe:
            exec:
              command: ["cat", "/ready"]
            periodSeconds: 2
          securityContext:
            privileged: true
          volumeMounts:
            - name: profile
              mountPath: /profile
              readOnly: true
            - name: host-apparmor
              mountPath: /host/etc/apparmor.d
      volumes:
        - name: profile
          configMap:
            name: apparmor-localhost-profile
        - name: host-apparmor
          hostPath:
            path: /etc/apparmor.d
            type: Directory
