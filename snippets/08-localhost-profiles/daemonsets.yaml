# Доставка профилей Localhost на узел.
# Сначала этот файл, дождаться Ready, затем pods.yaml.
# Удаление DaemonSet не стирает файл seccomp и не выгружает профиль AppArmor из ядра.
# Профиль seccomp: RuntimeDefault containerd 2.2.1 для amd64.
# К этому списку добавлены вызовы сборки mount, umount2 и pivot_root.
# clone разрешён, пока в флагах нет нового пространства имён; clone3 возвращает ENOSYS.
# Профиль AppArmor: шаблон containerd, вместо deny mount стоят mount и pivot_root.
